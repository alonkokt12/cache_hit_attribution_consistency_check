[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alonkokt12-cache_hit_attribution_consistency_check"
version = "0.1.0"
description = "在同一个输入里两两比对，检测强化学习研究员·缓存命中率的归因相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alonkokt12" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alonkokt12.github.io"
Repository = "https://github.com/alonkokt12/cache_hit_attribution_consistency_check"
Issues = "https://github.com/alonkokt12/cache_hit_attribution_consistency_check/issues"

[project.scripts]
cache_hit_attribution_consistency_check = "cache_hit_attribution_consistency_check:main"

[tool.setuptools]
py-modules = ["cache_hit_attribution_consistency_check"]
